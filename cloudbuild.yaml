steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/facilityops/app:$BUILD_ID', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/facilityops/app:$BUILD_ID']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/facilityops/app:$BUILD_ID'
substitutions:
  _REGION: asia-south1
options:
  logging: CLOUD_LOGGING_ONLY
