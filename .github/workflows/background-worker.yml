name: FacilityOps automatic uploads and reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facilityops-background-worker
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OTP_SECRET: ${{ secrets.OTP_SECRET }}
      JOB_SECRET: ${{ secrets.JOB_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_SENDER: ${{ secrets.GOOGLE_SENDER }}
      APP_ORIGIN: https://facilityops-8rvd.onrender.com
      INTEGRATION_MODE: google
      NODE_ENV: production
    steps:
      - name: Ensure required secrets are configured
        shell: bash
        run: |
          missing=0
          for key in DATABASE_URL OTP_SECRET JOB_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GOOGLE_SENDER; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing Actions secret: $key"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install production dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Process queued evidence uploads and emails
        run: npm run worker
