services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: facilityops
      POSTGRES_USER: facilityops
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facilityops"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
